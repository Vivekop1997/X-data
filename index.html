<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SYS.AUTO // GRID PAINTER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
  :root {
    --purple: #9b59ff;
    --purple-dim: #6b3bbf;
    --purple-glow: #c084fc;
    --bg: #0a0612;
    --hud-text: #b88aff;
    --hud-bright: #e0c8ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: var(--bg);
    color: var(--hud-text);
    font-family: 'Share Tech Mono', monospace;
    height: 100%; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
    pointer-events:none; z-index:1000;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background: radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.65) 100%);
    pointer-events:none; z-index:999;
  }
  .app { display:flex; flex-direction:column; height:100dvh; height:100vh; }

  /* TOP HUD */
  .hud-top {
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 10px; border-bottom:1px solid var(--purple-dim);
    background:rgba(12,4,25,0.95); flex-shrink:0; gap:4px;
  }
  .hud-tl, .hud-tr {
    display:flex; flex-direction:column; font-size:10px; line-height:1.45; min-width:78px;
  }
  .hud-tr { text-align:right; }
  .hud-val { color:var(--hud-bright); }
  .hud-tc { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .target-locked {
    font-family:'VT323',monospace; font-size:clamp(12px,3.5vw,20px);
    color:var(--purple-glow); letter-spacing:4px;
    text-shadow:0 0 10px var(--purple); animation:pulse 2s ease-in-out infinite;
    white-space:nowrap;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
  .ruler-wrap { position:relative; width:100%; max-width:280px; }
  #ruler-canvas { display:block; width:100%; height:16px; }
  .bearing-marker {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:4px solid transparent; border-right:4px solid transparent;
    border-top:6px solid var(--purple-glow); filter:drop-shadow(0 0 3px var(--purple));
  }

  /* MIDDLE */
  .middle { display:flex; flex:1; overflow:hidden; min-height:0; }

  /* CANVAS AREA */
  .canvas-col { display:flex; flex-direction:column; flex:1; min-width:0; overflow:hidden; }
  .canvas-wrap {
    position:relative; flex:1; overflow:hidden;
    cursor:crosshair; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  #canvas-box { position:relative; flex-shrink:0; }
  #grid-canvas { display:block; }
  .bracket {
    position:absolute; width:20px; height:20px;
    border-color:var(--purple-glow); border-style:solid; opacity:0.65; pointer-events:none;
  }
  .bracket.tl { top:6px; left:6px; border-width:2px 0 0 2px; }
  .bracket.tr { top:6px; right:6px; border-width:2px 2px 0 0; }
  .bracket.bl { bottom:6px; left:6px; border-width:0 0 2px 2px; }
  .bracket.br { bottom:6px; right:6px; border-width:0 2px 2px 0; }

  /* RIGHT PANEL */
  .panel-right {
    width:116px; flex-shrink:0;
    display:flex; flex-direction:column;
    border-left:1px solid var(--purple-dim);
    background:rgba(12,4,25,0.93);
    overflow-y:auto; overflow-x:hidden;
    padding:7px 6px; gap:7px;
  }
  .panel-right::-webkit-scrollbar { width:0; }
  .stat-row { display:flex; justify-content:space-between; font-size:10px; }
  .stat-row .k { color:var(--hud-text); } .stat-row .v { color:var(--hud-bright); }
  .divider { border:none; border-top:1px solid rgba(107,59,191,0.35); }
  .sec-label { font-size:8px; letter-spacing:2px; color:rgba(155,89,255,0.5); text-transform:uppercase; margin-bottom:4px; }
  .color-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; }
  .swatch {
    width:100%; aspect-ratio:1;
    border:1px solid rgba(155,89,255,0.3); cursor:pointer;
    transition:transform .1s, box-shadow .1s;
  }
  .swatch:hover { transform:scale(1.1); }
  .swatch.active { border:2px solid var(--purple-glow); box-shadow:0 0 6px var(--purple); }
  .size-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:3px; }
  .size-btn {
    background:rgba(100,50,200,0.15); border:1px solid var(--purple-dim);
    color:var(--hud-text); font-family:'Share Tech Mono',monospace;
    font-size:9px; padding:4px 0; cursor:pointer; text-align:center;
    transition:background .1s, border-color .1s;
  }
  .size-btn:hover { background:rgba(100,50,200,0.3); border-color:var(--purple); }
  .size-btn.active {
    background:rgba(100,50,200,0.5); border-color:var(--purple-glow);
    color:var(--hud-bright); box-shadow:0 0 5px rgba(107,59,191,0.5);
  }
  .tool-btn {
    width:100%; background:rgba(100,50,200,0.15);
    border:1px solid var(--purple-dim); color:var(--hud-text);
    font-family:'Share Tech Mono',monospace;
    font-size:9px; padding:5px 4px; cursor:pointer; text-align:left;
    letter-spacing:1px; transition:all .1s; margin-bottom:3px;
  }
  .tool-btn:hover { background:rgba(100,50,200,0.3); border-color:var(--purple); color:var(--hud-bright); }
  .tool-btn.active { background:rgba(100,50,200,0.45); border-color:var(--purple-glow); color:var(--hud-bright); box-shadow:0 0 6px rgba(107,59,191,0.5); }
  .tool-btn.danger { border-color:rgba(255,80,120,0.4); color:rgba(255,150,180,0.8); }
  .tool-btn.danger:hover { background:rgba(200,30,60,0.25); border-color:rgba(255,80,120,0.8); color:#ff96b4; }

  /* BOTTOM BAR */
  .hud-bottom {
    display:flex; align-items:center; justify-content:space-between;
    padding:3px 10px; border-top:1px solid var(--purple-dim);
    background:rgba(12,4,25,0.95); font-size:9px; flex-shrink:0; gap:6px;
  }
  .status-dot {
    display:inline-block; width:6px; height:6px;
    background:var(--purple-glow); margin-right:4px;
    box-shadow:0 0 5px var(--purple); animation:blink 1.4s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
  .linked-box {
    border:1px solid var(--purple); padding:1px 5px; font-size:9px;
    background:rgba(100,50,200,0.25); box-shadow:0 0 6px rgba(107,59,191,0.4);
    letter-spacing:2px; white-space:nowrap;
  }
</style>
</head>
<body>
<div class="app">

  <div class="hud-top">
    <div class="hud-tl">
      <div>SYS. <span class="hud-val">AUTO</span></div>
      <div>MODE <span class="hud-val">PAINT</span></div>
      <div>LCK <span class="hud-val">ON</span></div>
      <div>AREA: <span class="hud-val" id="stat-area">00</span></div>
    </div>
    <div class="hud-tc">
      <div class="target-locked">◇ TARGET LOCKED ◇</div>
      <div class="ruler-wrap">
        <canvas id="ruler-canvas"></canvas>
        <div class="bearing-marker"></div>
      </div>
    </div>
    <div class="hud-tr">
      <div>X: <span class="hud-val" id="stat-x">1427.35°</span></div>
      <div>Y: <span class="hud-val" id="stat-y">3071.92°</span></div>
      <div>SPD: <span class="hud-val">0.0</span></div>
      <div>RNG: <span class="hud-val">7563m</span></div>
      <div>ELV: <span class="hud-val">000m</span></div>
    </div>
  </div>

  <div class="middle">
    <div class="canvas-col">
      <div class="canvas-wrap" id="canvas-wrap">
        <div id="canvas-box">
          <canvas id="grid-canvas"></canvas>
          <div class="bracket tl"></div>
          <div class="bracket tr"></div>
          <div class="bracket bl"></div>
          <div class="bracket br"></div>
        </div>
      </div>
    </div>

    <div class="panel-right">
      <div class="stat-row"><span class="k">ID:</span><span class="v">14-488</span></div>
      <div class="stat-row"><span class="k">SAT:</span><span class="v">07</span></div>
      <div class="stat-row"><span class="k">BLK:</span><span class="v" id="stat-blocks">0</span></div>
      <hr class="divider">
      <div>
        <div class="sec-label">// COLOR</div>
        <div class="color-grid" id="color-grid"></div>
      </div>
      <hr class="divider">
      <div>
        <div class="sec-label">// SIZE</div>
        <div class="size-grid" id="size-grid"></div>
      </div>
      <hr class="divider">
      <div>
        <div class="sec-label">// TOOLS</div>
        <button class="tool-btn active" id="btn-paint" onclick="setTool('paint')">▣ PAINT</button>
        <button class="tool-btn" id="btn-erase" onclick="setTool('erase')">◻ ERASE</button>
        <button class="tool-btn" id="btn-fill"  onclick="setTool('fill')">▦ FILL</button>
      </div>
      <hr class="divider">
      <button class="tool-btn danger" onclick="clearAll()">✕ CLEAR</button>
    </div>
  </div>

  <div class="hud-bottom">
    <div><span class="status-dot"></span>ID: 14-488 | SAT: 07</div>
    <div>FEED SAT // REL 0 | <span id="stat-grid-size">–</span></div>
    <div class="linked-box">LINKED ■</div>
  </div>

</div>

<script>
const COLORS = [
  { fill:'rgba(100,40,210,0.6)',   border:'#b088ff' },
  { fill:'rgba(20,160,200,0.5)',   border:'#60e0ff' },
  { fill:'rgba(200,40,120,0.5)',   border:'#ff80c8' },
  { fill:'rgba(30,200,100,0.45)',  border:'#60ffb0' },
  { fill:'rgba(220,120,20,0.5)',   border:'#ffb040' },
  { fill:'rgba(200,190,255,0.35)', border:'#e8e0ff' },
];
const SIZES = [1,2,3,4,5,6];

let currentColor = 0, currentSize = 1, currentTool = 'paint';
let isDown = false, blocks = [];
let CELL = 32, COLS = 1, ROWS = 1, CW = 1, CH = 1;
let hoverGX = -1, hoverGY = -1;

const wrap   = document.getElementById('canvas-wrap');
const cbox   = document.getElementById('canvas-box');
const canvas = document.getElementById('grid-canvas');
const ctx    = canvas.getContext('2d');

function drawRuler() {
  const rc = document.getElementById('ruler-canvas');
  const W  = rc.parentElement.clientWidth || 200;
  rc.width = W; rc.height = 16;
  const rx = rc.getContext('2d');
  rx.clearRect(0,0,W,16);
  const labels=[270,275,280,285,290,295,300,305,310];
  const step = W/(labels.length-1);
  labels.forEach((l,i)=>{
    const x=i*step, major=l%10===0;
    rx.strokeStyle='#8855dd'; rx.lineWidth=major?1.5:0.7;
    rx.beginPath(); rx.moveTo(x,major?0:7); rx.lineTo(x,14); rx.stroke();
    if(major){ rx.fillStyle='#b088ff'; rx.font='8px Share Tech Mono'; rx.fillText(l,x-7,10); }
  });
  for(let i=0;i<labels.length-1;i++){
    for(let t=1;t<5;t++){
      const x=i*step+t*(step/5);
      rx.strokeStyle='#6644aa'; rx.lineWidth=0.5;
      rx.beginPath(); rx.moveTo(x,10); rx.lineTo(x,14); rx.stroke();
    }
  }
}

function resize() {
  drawRuler();
  const wW = wrap.clientWidth, wH = wrap.clientHeight;
  // Fit 16:9 inside wrap
  let cw = wW, ch = Math.round(wW*9/16);
  if(ch > wH){ ch = wH; cw = Math.round(wH*16/9); }
  CW = cw; CH = ch;
  canvas.width = cw; canvas.height = ch;
  cbox.style.width = cw+'px'; cbox.style.height = ch+'px';
  // Cell: target ~30px, at least 16
  CELL = Math.max(16, Math.floor(Math.min(cw,ch)/18));
  COLS = Math.floor(cw/CELL);
  ROWS = Math.floor(ch/CELL);
  document.getElementById('stat-grid-size').textContent = COLS+'×'+ROWS;
  render();
}
window.addEventListener('resize', resize);

// Build color swatches
const cgrid = document.getElementById('color-grid');
COLORS.forEach((c,i)=>{
  const s=document.createElement('div');
  s.className='swatch'+(i===0?' active':'');
  s.style.background=c.fill;
  s.style.boxShadow='0 0 4px '+c.border+'55';
  s.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    document.querySelectorAll('.swatch').forEach(el=>el.classList.remove('active'));
    s.classList.add('active'); currentColor=i;
  });
  cgrid.appendChild(s);
});

// Build size buttons
const sgrid = document.getElementById('size-grid');
SIZES.forEach(sz=>{
  const b=document.createElement('button');
  b.className='size-btn'+(sz===1?' active':'');
  b.textContent=sz+'×'+sz; b.dataset.size=sz;
  b.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    document.querySelectorAll('.size-btn').forEach(el=>el.classList.remove('active'));
    b.classList.add('active'); currentSize=sz; render();
  });
  sgrid.appendChild(b);
});

function setTool(t){
  currentTool=t;
  ['paint','erase','fill'].forEach(n=>{
    document.getElementById('btn-'+n).classList.toggle('active',n===t);
  });
}

function ox(){ return Math.floor((CW-COLS*CELL)/2); }
function oy(){ return Math.floor((CH-ROWS*CELL)/2); }

function pxToGrid(px,py){
  return { gx:Math.floor((px-ox())/CELL), gy:Math.floor((py-oy())/CELL) };
}
function gridToPx(gx,gy){
  return { px:ox()+gx*CELL, py:oy()+gy*CELL };
}
function inB(gx,gy){ return gx>=0&&gy>=0&&gx<COLS&&gy<ROWS; }

function placeBlock(gx,gy){
  const sz=currentSize;
  if(currentTool==='fill'){
    blocks=[];
    for(let r=0;r+sz<=ROWS;r+=sz)
      for(let c=0;c+sz<=COLS;c+=sz)
        blocks.push({gx:c,gy:r,w:sz,h:sz,ci:currentColor});
  } else if(currentTool==='erase'){
    const half=Math.floor(sz/2);
    const ex=gx-half, ey=gy-half;
    blocks=blocks.filter(b=>!(b.gx<ex+sz&&b.gx+b.w>ex&&b.gy<ey+sz&&b.gy+b.h>ey));
  } else {
    const half=Math.floor(sz/2);
    const bx=Math.max(0,Math.min(COLS-sz,gx-half));
    const by=Math.max(0,Math.min(ROWS-sz,gy-half));
    blocks=blocks.filter(b=>!(b.gx<bx+sz&&b.gx+b.w>bx&&b.gy<by+sz&&b.gy+b.h>by));
    blocks.push({gx:bx,gy:by,w:sz,h:sz,ci:currentColor});
  }
  document.getElementById('stat-blocks').textContent=blocks.length;
  document.getElementById('stat-area').textContent=String(blocks.length).padStart(2,'0');
  render();
}

function clearAll(){
  blocks=[];
  document.getElementById('stat-blocks').textContent=0;
  document.getElementById('stat-area').textContent='00';
  render();
}

function render(){
  const gW=COLS*CELL, gH=ROWS*CELL;
  const OX=ox(), OY=oy();
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#0a0612'; ctx.fillRect(0,0,CW,CH);

  // grid lines
  ctx.strokeStyle='rgba(155,89,255,0.13)'; ctx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){
    const x=OX+c*CELL;
    ctx.beginPath(); ctx.moveTo(x,OY); ctx.lineTo(x,OY+gH); ctx.stroke();
  }
  for(let r=0;r<=ROWS;r++){
    const y=OY+r*CELL;
    ctx.beginPath(); ctx.moveTo(OX,y); ctx.lineTo(OX+gW,y); ctx.stroke();
  }
  // scanlines
  ctx.fillStyle='rgba(0,0,0,0.06)';
  for(let y=OY;y<OY+gH;y+=4) ctx.fillRect(OX,y,gW,2);

  // blocks
  blocks.forEach(b=>{
    const {px,py}=gridToPx(b.gx,b.gy);
    const bw=b.w*CELL, bh=b.h*CELL;
    const col=COLORS[b.ci];
    ctx.fillStyle=col.fill; ctx.fillRect(px+1,py+1,bw-2,bh-2);
    ctx.fillStyle='rgba(255,255,255,0.025)';
    for(let sy=py+1;sy<py+bh-1;sy+=3) ctx.fillRect(px+1,sy,bw-2,1);
    ctx.strokeStyle=col.border+'55'; ctx.lineWidth=3;
    ctx.strokeRect(px+1,py+1,bw-2,bh-2);
    ctx.strokeStyle=col.border; ctx.lineWidth=1;
    ctx.strokeRect(px+1,py+1,bw-2,bh-2);
    const cs=Math.max(1,Math.floor(CELL/14));
    ctx.fillStyle=col.border;
    [[px+2,py+2],[px+bw-3,py+2],[px+2,py+bh-3],[px+bw-3,py+bh-3]]
      .forEach(([cx,cy])=>ctx.fillRect(cx,cy,cs,cs));
  });

  // hover
  if(inB(hoverGX,hoverGY)){
    const sz=currentSize;
    const half=Math.floor(sz/2);
    const bx=Math.max(0,Math.min(COLS-sz,hoverGX-half));
    const by=Math.max(0,Math.min(ROWS-sz,hoverGY-half));
    const {px,py}=gridToPx(bx,by);
    const col=COLORS[currentColor];
    if(currentTool==='paint'){
      ctx.fillStyle=col.fill.replace(/[\d.]+\)$/,'0.18)');
      ctx.fillRect(px+1,py+1,sz*CELL-2,sz*CELL-2);
      ctx.strokeStyle=col.border; ctx.lineWidth=1;
      ctx.setLineDash([3,3]); ctx.strokeRect(px+1,py+1,sz*CELL-2,sz*CELL-2); ctx.setLineDash([]);
    } else if(currentTool==='erase'){
      ctx.strokeStyle='rgba(255,80,120,0.65)'; ctx.lineWidth=1;
      ctx.setLineDash([3,3]); ctx.strokeRect(px+1,py+1,sz*CELL-2,sz*CELL-2); ctx.setLineDash([]);
    }
  }

  // border
  ctx.strokeStyle='rgba(155,89,255,0.28)'; ctx.lineWidth=1;
  ctx.strokeRect(OX,OY,gW,gH);
}

// pointer event helpers
function getCanvasXY(e){
  const rect=canvas.getBoundingClientRect();
  const scX=CW/rect.width, scY=CH/rect.height;
  const src=e.touches ? e.touches[0] : e;
  return pxToGrid((src.clientX-rect.left)*scX,(src.clientY-rect.top)*scY);
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); isDown=true;
  const {gx,gy}=getCanvasXY(e);
  hoverGX=gx; hoverGY=gy; placeBlock(gx,gy);
},{passive:false});

canvas.addEventListener('pointermove',e=>{
  e.preventDefault();
  const {gx,gy}=getCanvasXY(e);
  document.getElementById('stat-x').textContent=(1427+(gx/COLS)*100).toFixed(2)+'°';
  document.getElementById('stat-y').textContent=(3071+(gy/ROWS)*100).toFixed(2)+'°';
  if(gx!==hoverGX||gy!==hoverGY){ hoverGX=gx; hoverGY=gy; render(); }
  if(isDown) placeBlock(gx,gy);
},{passive:false});

canvas.addEventListener('pointerup',   ()=>{ isDown=false; });
canvas.addEventListener('pointerleave',()=>{ isDown=false; hoverGX=-1; hoverGY=-1; render(); });

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='p') setTool('paint');
  if(k==='e') setTool('erase');
  if(k==='f') setTool('fill');
  if(k==='x') clearAll();
  if(k>='1'&&k<='6'){
    currentSize=parseInt(k);
    document.querySelectorAll('.size-btn').forEach(b=>{
      b.classList.toggle('active',parseInt(b.dataset.size)===currentSize);
    });
    render();
  }
});

resize();
</script>
</body>
</html>
